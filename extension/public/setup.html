<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup - Vaultly</title>
  <link rel="stylesheet" href="../styles/popup.css">
  <style>
    :root {
      --primary-500: #16a34a;
      --primary-600: #15803d;
      --primary-700: #166534;
    }
    body {
      width: 400px;
      padding: 20px;
    }
    .setup-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-weight: 500;
      font-size: 14px;
      color: #374151;
    }
    input {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary-500);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
    }
    button {
      padding: 10px 16px;
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.3);
    }
    .help-text {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }
    .success {
      padding: 12px;
      background: #d1fae5;
      color: #065f46;
      border-radius: 8px;
      font-size: 14px;
    }
    .error {
      padding: 12px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      font-size: 14px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #e5e7eb;
      border-top-color: var(--primary-500);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="setup-container">
    <div style="text-align: center; margin-bottom: 20px;">
      <h1>🔐 Vaultly Setup</h1>
      <p style="color: #6b7280; margin: 8px 0 0 0; font-size: 14px;">Step-by-step onboarding for your account</p>
    </div>

    <div id="message"></div>

    <form id="setup-form" style="display: flex; flex-direction: column; gap: 16px;"></form>
  </div>

  <script src="../src/utils.js"></script>
  <script src="setup.js"></script>
</body>
</html>
